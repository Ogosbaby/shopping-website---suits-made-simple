<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#212832"/>
  <title>Suits Made Simple</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    html,body{
      height:100%;width:100%;
      background:#212832;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      font-synthesis:none;
    }

    /* ── Splash wrapper ───────────────────────────── */
    #splash{
      display:flex;flex-direction:column;align-items:center;
      gap:2.5rem;
      opacity:1;
      transition:opacity 0.6s cubic-bezier(0.4,0,0.6,1);
    }
    #splash.out{opacity:0}

    /* ── Radial glow behind the mark ─────────────── */
    .glow{
      position:absolute;inset:-40px;
      border-radius:50%;
      background:radial-gradient(circle at 50% 48%,
        rgba(91,108,130,0.42) 0%,
        rgba(59,70,84,0.18) 40%,
        transparent 70%);
      opacity:0;
      animation:glowIn 1.1s 0.1s ease-out forwards;
    }

    /* ── SVG mark wrapper ─────────────────────────── */
    .mark-wrap{
      position:relative;
      width:148px;height:148px;
      display:flex;align-items:center;justify-content:center;
    }
    .suit-svg{
      width:100%;height:100%;
      overflow:visible;
      filter:drop-shadow(0 8px 28px rgba(0,0,0,0.55));
    }

    /* shared SVG part base */
    .p-lapel-l,.p-lapel-r,.p-knot,.p-body,.p-btn{
      opacity:0;
      transform-box:fill-box;
      transform-origin:center;
    }

    /* Collar V — stroke-dash draw from left tip → right tip */
    .p-collar{
      fill:none;
      stroke:#ffffff;
      stroke-width:3.4;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:36;
      stroke-dashoffset:36;
      animation:drawPath 0.42s 0.52s ease-out forwards;
    }

    /* Left lapel — slides in from the left */
    .p-lapel-l{
      fill:#ffffff;
      animation:fromLeft 0.42s 0.24s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    /* Right lapel — slides in from the right */
    .p-lapel-r{
      fill:#ffffff;
      animation:fromRight 0.42s 0.32s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    /* Tie knot — spring-pops from centre */
    .p-knot{
      fill:#ffffff;
      animation:popIn 0.38s 0.64s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    /* Jacket body — grows downward from the chest line */
    .p-body{
      fill:#ffffff;
      transform-box:fill-box;
      transform-origin:50% 0%;        /* top-centre of bounding box */
      animation:growDown 0.46s 0.78s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    /* Bottom button — final pop */
    .p-btn{
      fill:#ffffff;
      animation:popIn 0.3s 1.08s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    /* ── Brand text block ─────────────────────────── */
    .brand-block{
      display:flex;flex-direction:column;align-items:center;gap:0.6rem;
      opacity:0;
      animation:fadeUp 0.65s 1.42s ease-out forwards;
    }
    .brand-name{
      font-family:Georgia,"Times New Roman",serif;
      font-size:0.72rem;
      font-weight:400;
      letter-spacing:0.40em;
      text-transform:uppercase;
      color:rgba(255,255,255,0.90);
      padding-left:0.40em; /* optical compensation */
    }
    .brand-rule{
      width:28px;height:1px;
      background:rgba(255,255,255,0.25);
    }
    .brand-sub{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      font-size:0.46rem;
      letter-spacing:0.28em;
      text-transform:uppercase;
      color:rgba(255,255,255,0.38);
      padding-left:0.28em;
    }

    /* ── Loading indicator ────────────────────────── */
    .dots{
      display:flex;gap:6px;
      opacity:0;
      animation:fadeIn 0.4s 2.05s ease forwards;
    }
    .dots span{
      width:5px;height:5px;border-radius:50%;
      background:rgba(255,255,255,0.28);
      animation:pulse 1.3s infinite ease-in-out;
    }
    .dots span:nth-child(2){animation-delay:0.22s}
    .dots span:nth-child(3){animation-delay:0.44s}

    /* ── Keyframes ────────────────────────────────── */
    @keyframes glowIn{
      0%{opacity:0}100%{opacity:1}
    }
    @keyframes drawPath{
      to{stroke-dashoffset:0}
    }
    @keyframes fromLeft{
      from{opacity:0;transform:translateX(-18px) scale(0.88)}
      to{opacity:1;transform:translateX(0) scale(1)}
    }
    @keyframes fromRight{
      from{opacity:0;transform:translateX(18px) scale(0.88)}
      to{opacity:1;transform:translateX(0) scale(1)}
    }
    @keyframes popIn{
      0%  {opacity:0;transform:scale(0)}
      62% {transform:scale(1.32)}
      100%{opacity:1;transform:scale(1)}
    }
    @keyframes growDown{
      from{opacity:0;transform:scaleY(0)}
      to  {opacity:1;transform:scaleY(1)}
    }
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(12px)}
      to  {opacity:1;transform:translateY(0)}
    }
    @keyframes fadeIn{
      to{opacity:1}
    }
    @keyframes pulse{
      0%,80%,100%{opacity:0.25;transform:scale(0.8)}
      40%{opacity:1;transform:scale(1)}
    }
  </style>
</head>
<body>
  <div id="splash">

    <!-- Suit mark with staged animations -->
    <div class="mark-wrap">
      <div class="glow"></div>

      <svg class="suit-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        <!--
          Animation order (forming a suit from the shoulders down):
          1. Left lapel slides in from left       0.24 s
          2. Right lapel slides in from right     0.32 s
          3. Collar V draws itself (stroke-dash)  0.52 s
          4. Tie knot springs into place          0.64 s
          5. Jacket body grows downward           0.78 s
          6. Button pops in                       1.08 s
        -->

        <!-- 1 & 2 — Lapels (filled polygons) -->
        <path class="p-lapel-l" d="M38 17 L14 25 L30 42 L44 33 Z"/>
        <path class="p-lapel-r" d="M62 17 L86 25 L70 42 L56 33 Z"/>

        <!-- 3 — Collar V (stroked path drawn via dashoffset) -->
        <path class="p-collar"  d="M38 16 L50 26 L62 16"/>

        <!-- 4 — Tie knot (diamond) -->
        <path class="p-knot"    d="M50 22 L56.5 28.5 L50 35 L43.5 28.5 Z"/>

        <!-- 5 — Jacket body (trapezoid, grows from chest line down) -->
        <path class="p-body"    d="M45.5 31.5 L54.5 31.5 L58 62 L50 74 L42 62 Z"/>

        <!-- 6 — Button -->
        <circle class="p-btn"   cx="50" cy="82" r="3"/>

      </svg>
    </div>

    <!-- Brand identity -->
    <div class="brand-block">
      <p class="brand-name">Suits Made Simple</p>
      <div class="brand-rule"></div>
      <p class="brand-sub">Premium &middot; Tailored &middot; Yours</p>
    </div>

    <!-- Loading dots — appear just before redirect -->
    <div class="dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

  </div><!-- /#splash -->

  <script>
    /**
     * After the animation completes, fade out and navigate to the live
     * storefront.  window.location.replace is used so pressing Android
     * Back does not loop back here.
     *
     * If the user is already signed in the Next.js /login page will
     * detect the session and auto-redirect them to the homepage.
     */
    var VERCEL = 'https://shopping-website-suits-made-simple.vercel.app';

    setTimeout(function () {
      var el = document.getElementById('splash');
      if (el) el.classList.add('out');

      setTimeout(function () {
        window.location.replace(VERCEL + '/login?from=app&next=/');
      }, 620);

    }, 2780);
  </script>
</body>
</html>
